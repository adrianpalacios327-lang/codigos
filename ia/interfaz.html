<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudNova IA - Chat</title>
    <link rel="stylesheet" href="/ia/css.css">
</head>
<body>

    <!-- Overlay para cerrar el menú al hacer clic afuera -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Menú Lateral Izquierdo (Historial) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Historial de Planes</h2>
            <button class="close-btn" id="closeBtn" onclick="toggleMenu()">&times;</button>
        </div>
        <div class="sidebar-content">
            <button type="button" class="btn-sidebar-nuevo-chat" onclick="iniciarNuevoChat()">
                <span>➕</span> Nuevo Chat
            </button>
            <ul class="history-list" id="history-list">
                <!-- Los planes guardados se cargarán aquí dinámicamente desde la BD -->
            </ul>
        </div>
    </aside>

    <div class="contenedor">
        <div class="header">
            <!-- Botón Menú Hamburguesa en la zona izquierda -->
            <button class="hamburger-btn" id="menuToggle" onclick="toggleMenu()" aria-label="Abrir historial">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button type="button" class="btn-nuevo-chat" onclick="iniciarNuevoChat()" title="Iniciar un nuevo chat">➕ Nuevo Chat</button>
            <button type="button" class="cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesion</button>
            <h1>StudNova IA</h1>
            <p>Tu asistente inteligente para generar planes de estudio</p>
        </div>

        <div class="chat" id="chat-box">
            <div class="mensaje">
                <div class="avatar">
                    <img src="avatar.png" alt="Logo" width="50" height="50" class="logo" style="border-radius:50%; object-fit:cover;">
                </div>
                <div class="contenido">
                    <p>¡Hola! 👋 Soy tu asistente de <strong>StudNova IA</strong>.</p>
                    <p style="margin-top: 8px;">Cuéntame, ¿qué materia o tema te gustaría aprender hoy?</p>
                </div>
            </div>
        </div>

        <!-- Contenedor del archivo adjunto y opciones de configuración del plan -->
        <div id="contenedor-adjunto" class="contenedor-adjunto" style="display: none;">
            <div class="adjunto-info">
                <span class="icono-archivo">📄</span>
                <span id="nombre-archivo-adjunto" class="nombre-archivo">archivo.pdf</span>
                <button type="button" class="btn-quitar-adjunto" onclick="quitarArchivoAdjunto()" title="Quitar archivo">&times;</button>
            </div>
            <div class="adjunto-opciones">
                <label for="select-modulos">Módulos:</label>
                <select id="select-modulos" class="selector-opcion">
                    <option value="">Automático</option>
                    <option value="2">2 módulos</option>
                    <option value="3">3 módulos</option>
                    <option value="4">4 módulos</option>
                    <option value="5">5 módulos</option>
                    <option value="6">6 módulos</option>
                </select>

                <label for="select-duracion">Duración:</label>
                <select id="select-duracion" class="selector-opcion">
                    <option value="">Automática</option>
                    <option value="1 semana">1 semana</option>
                    <option value="2 semanas">2 semanas</option>
                    <option value="3 semanas">3 semanas</option>
                    <option value="4 semanas">4 semanas</option>
                    <option value="2 meses">2 meses</option>
                </select>
            </div>
        </div>

        <div class="escribir">
            <!-- Botón Clip para adjuntar documentos (PDF, TXT, OCR) -->
            <button type="button" id="btn-adjuntar" class="btn-adjuntar" onclick="activarInputArchivo()" title="Adjuntar temario o documento (PDF, TXT, OCR)">
                📎
            </button>
            <input type="file" id="input-archivo" accept=".pdf,.txt,.md,.csv,.png,.jpg,.jpeg" style="display: none;" onchange="manejarArchivoSeleccionado(event)">

            <textarea id="prompt-input" rows="2" placeholder="Escribe tu mensaje o instrucciones para el plan..." onkeydown="manejarEnter(event)"></textarea>
            <button id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <!-- Modal Emergente: Lección Completada -->
    <div id="modal-completado" class="modal-overlay">
        <div class="modal-contenido">
            <div class="modal-icono">🏆</div>
            <h3 class="modal-titulo">¡Lección Completada!</h3>
            <p id="texto-motivacional" class="modal-texto">
                <!-- El mensaje aleatorio se inserta dinámicamente con JS -->
            </p>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModalCompletado()">
                Continuar estudiando ✨
            </button>
        </div>
    </div>

    <!-- Script modular de StudNova IA -->
    <script src="/ia/renderizador.js"></script>
</body>
</html>
